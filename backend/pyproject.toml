[project]
name = "multiaccbrowser"
version = "0.1.0"
description = "Automates Chrome profile management, proxy rotation, and fingerprint spoofing using Playwright"
authors = [
    { name = "maxxxbond" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi (>=0.115.11,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "playwright (>=1.50.0,<2.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "browserforge (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry]
package-mode = false